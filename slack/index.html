<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Harf sign-in</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1a1a1a;--sub:#6b6b6b;--line:#e4e4e0}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f2f2f2;--sub:#a0a0a0;--line:#333}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;max-width:440px;margin:16px;text-align:center}
h1{font-size:22px;margin:0 0 6px}p{color:var(--sub);margin:0}a{color:inherit}
</style></head><body><div class="card">
<h1>Returning to Harf&hellip;</h1>
<p id="msg">Handing your Slack sign-in back to the Harf app on this Mac.</p>
</div><script>
// Slack only distributes apps whose return address is https, but Harf
// receives the sign-in on this Mac (a one-shot listener on localhost).
// This page is that hop: it forwards the query string (?code=…&state=…)
// unchanged and keeps nothing. The code is useless without the secret
// verifier that never leaves the Mac (PKCE).
var target = "http://localhost:8471/harf/slack" + location.search;
location.replace(target);
setTimeout(function () {
  var m = document.getElementById("msg");
  m.innerHTML = "If nothing happens, make sure Harf is open and <a id='go'>click here</a>.";
  document.getElementById("go").href = target;
}, 2500);
</script></body></html>
